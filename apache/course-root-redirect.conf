# Install these directives inside the existing HTTPS <VirtualHost *:443>.
# They are server/vhost configuration, not .htaccess configuration.
# mod_rewrite and mod_shib must already be enabled.

# Authenticate and validate the identity at the exact course root.
# The strict lowercase pattern matches the generated student directory names.
<LocationMatch "^/orie4580_fa26/?$">
    AuthType shibboleth
    ShibRequestSetting requireSession 1

    <RequireAll>
        Require valid-user
        Require expr "%{REMOTE_USER} =~ m#^[a-z]{2,3}[0-9]+$#"
    </RequireAll>
</LocationMatch>

RewriteEngine On
RewriteCond %{LA-U:REMOTE_USER} ^([a-z]{2,3}[0-9]+)$
RewriteRule ^/orie4580_fa26/?$ /orie4580_fa26/students/%1/ [R=302,L,NE]

# Keep R=302 until the redirect and authorization matrix are proven.
# The generated students/<netid>/.htaccess remains the authorization boundary.
